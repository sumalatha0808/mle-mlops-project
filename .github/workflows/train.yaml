name: Train taxi model

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train.yaml"
      - "src/**"
      - "dvc.yaml"
      - "dvc.lock"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: # "Run workflow" button on GitHub
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"

      - name: Install project dependencies
        run: uv sync --locked

      - name: Run the DVC pipeline (download data + train + log to MLflow)
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          DEVELOPER: github-actions
        run: uv run dvc repro

      - name: Show metrics
        run: uv run dvc metrics show

      - name: Upload model, metrics and MLflow run
        uses: actions/upload-artifact@v4
        with:
          name: training-run-${{ github.run_number }}
          path: |
            models/
            reports/train_metrics.json
            mlflow.db
            mlruns/
          if-no-files-found: warn
