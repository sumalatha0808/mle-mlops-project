stages:
  prepare_data:
    cmd: uv run python src/prepare_data.py
    deps:
      - src/prepare_data.py
    outs:
      - data/raw/green_tripdata_2024-01.parquet

  train_model:
    cmd: uv run python src/train.py
    deps:
      - src/train.py
      - src/preprocess.py
      - data/raw/green_tripdata_2024-01.parquet
      - uv.lock
    outs:
      - models/model.joblib
    metrics:
      - reports/train_metrics.json:
          cache: false
